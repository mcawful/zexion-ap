[project]
name = "zexion-ap"
version = "0.0.0"
description = "Archipelago multiworld support for Zexion"
# Archipelago supports Python 3.11 through 3.13, and the world must load on all of them.
requires-python = ">=3.11,<3.14"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".ap", "lab", "private", ".claude/worktrees"]
src = [".", "tools", ".claude/hooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"client/patterns.py" = ["E501"]  # one line per byte pattern

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tools", ".claude/hooks"]
addopts = "-q"
