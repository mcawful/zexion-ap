name: CI

# Every push to develop or main, and every pull request into them. Each check must pass before
# anything merges; branch protection requires all but the macOS job (docs/DEVELOPING.md,
# "Branches and releases"). A pull request into main also runs release-gate.yml.
#
# ZEXION_REQUIRE lists what a job's tests need and must find: a missing one fails a test, where
# the tests that use it would only skip (sh: tests/test_hook_runner.py; client: the world linked
# into AP, worlds/zexion/test/test_client_agrees.py; helper: the native build,
# tests/test_native.py, and on Linux tests/test_native_linux.py).
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  python:
    name: ruff and pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Everything but the game-facing code runs on all three (docs/DEVELOPING.md, "Platforms").
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # 3.13, as the dev venv (Archipelago 0.6.8 refuses 3.14). The venv is activated for later steps.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install
        run: uv pip install -r requirements-dev.txt
      - name: ruff format
        run: ruff format --check .
      - name: ruff check
        run: ruff check .
      - name: pytest
        env:
          ZEXION_REQUIRE: sh
        run: python -m pytest

  native:
    name: native helper (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S native -B native/build -A x64
          cmake --build native/build --config Release
      - name: Native tests
        run: ctest --test-dir native/build -C Release --output-on-failure
      # tests/test_native.py loads the build into a sleeping Python process (it would skip
      # without one; ZEXION_REQUIRE=helper makes a missing build fail instead).
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          activate-environment: true
      # That test needs only pytest (and the standard library), at requirements-dev.txt's pin.
      - name: Install
        shell: bash
        run: uv pip install "$(grep -o '^pytest==[^ ]*' requirements-dev.txt)"
      - name: Load test
        env:
          ZEXION_REQUIRE: helper
        run: python -m pytest tests/test_native.py -v

  # The release's build as release.yml does it, into a scratch folder: the DLLs built here, the
  # Linux helper of the Steam Runtime build downloaded as an artifact (made by an earlier job: the
  # file's age, which the builder checks against native/'s sources, is the download's). A release
  # that would refuse its own artifact fails here, not at the release. A job of its own, so the
  # Windows build and tests above do not wait for the Steam Runtime container, or fail with it.
  release-dry-run:
    name: release build, dry run (windows-latest)
    runs-on: windows-latest
    needs: native-linux-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: libzexion_ap-runtime
          path: native/build
      - name: Build the helper and proxy
        run: |
          cmake -S native -B native/build -A x64
          cmake --build native/build --config Release
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          activate-environment: true
      # The release's three files, as release.yml builds them: the apworld and the two archives,
      # which the builder reads back (each archive's files, and the Linux helper's mode) and lists.
      - name: Release build (dry run)
        shell: bash
        run: python tools/build_apworld.py --out "$RUNNER_TEMP/dist"
      # Kept a week, to look inside what a release of this commit would publish.
      - uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 7

  native-linux:
    name: native helper (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S native -B native/build
          cmake --build native/build -j
      - name: Native tests
        run: ctest --test-dir native/build --output-on-failure
      # tests/test_native_linux.py preloads the build into the stand-in game the build makes.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install
        run: uv pip install "$(grep -o '^pytest==[^ ]*' requirements-dev.txt)"
      - name: Preload test
        env:
          ZEXION_REQUIRE: helper
        run: python -m pytest tests/test_native_linux.py tests/test_native_linux_init_order.py -v

  # The Linux helper as a release builds it (release.yml): in the Steam Runtime's SDK, sniper, at
  # a pinned snapshot (by tag and digest), the runtime the game asks Steam for, with glibc 2.31,
  # GCC 14 and CMake 3.25. Built and tested there, then checked as the release checks it.
  native-linux-runtime:
    name: Linux helper (Steam Runtime)
    runs-on: ubuntu-latest
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:3.0.20261021.266025@sha256:bb30053d3cd19d35c76ae69b2790dbaa1430448006f8240cb6d7e723f2d1940e
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake -S native -B native/build -G Ninja -DCMAKE_CXX_COMPILER=g++-14
          cmake --build native/build
      - name: Native tests
        run: ctest --test-dir native/build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: libzexion_ap-runtime
          path: native/build/libzexion_ap.so
          if-no-files-found: error

  # The release's own check of that build (tools/build_apworld.py, --check-linux-helper): its
  # version, glibc 2.31 at most, numbered glibc versions only, no library but glibc's. Then the file
  # that ships, loaded: the stand-in game and the test helper are built here as native-linux builds
  # them, the downloaded Steam Runtime build takes the place of that job's own libzexion_ap.so, and
  # tests/test_native_linux.py preloads it into the stand-in (it does nothing in another program,
  # exports only the calls it stands in for) and tests/test_native_linux_init_order.py reads the
  # order of its own initializers (the Steam Runtime job runs only ctest, which loads none of it).
  native-linux-runtime-check:
    name: Linux helper (Steam Runtime) loads
    runs-on: ubuntu-latest
    needs: native-linux-runtime
    steps:
      - uses: actions/checkout@v7
      - name: Build the stand-in game and the test helper
        run: |
          cmake -S native -B native/build
          cmake --build native/build -j --target zap_fake_game zap_fake_game_bad zap_sdl_stub zap_swap_wrapper zexion_ap_hooktest
      - uses: actions/download-artifact@v4
        with:
          name: libzexion_ap-runtime
          path: native/build
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Check
        run: python tools/build_apworld.py --check-linux-helper native/build/libzexion_ap.so
      - name: Install
        run: uv pip install "$(grep -o '^pytest==[^ ]*' requirements-dev.txt)"
      - name: Preload test with the helper that ships
        env:
          ZEXION_REQUIRE: helper
        run: python -m pytest tests/test_native_linux.py tests/test_native_linux_init_order.py -v

  world:
    name: Archipelago world tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          activate-environment: true
      # pip too: Archipelago's ModuleUpdate installs its requirements with it.
      - name: Install
        run: uv pip install -r requirements-dev.txt pip
      - name: Archipelago at AP_VERSION, the world linked in
        run: python tools/ap_checkout.py
      - name: World tests
        working-directory: .ap/Archipelago
        env:
          AP_TEST_WORLDS: zexion
          ZEXION_REQUIRE: client
        run: python -m pytest test/general worlds/zexion/test
