name: Release gate

# Every pull request into main is a release (docs/DEVELOPING.md, "Branches and releases"), and
# branch protection on main requires this check. It is its own workflow, apart from CI, so it
# can run on `edited`: a pull request opened into develop and then retargeted to main gets a
# base change, which only `edited` reports. `edited` also fires on a title or body change; the
# gate runs then too. It is one short job, and a job skipped by `if:` counts as passing, so a
# skipped run would replace a failed one.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  release-gate:
    name: release gate
    # It must come from this repo's develop and raise the version above the last release and
    # above the version on main (a merged release waiting for approval has no tag yet, but main
    # already holds its version).
    runs-on: ubuntu-latest
    steps:
      - name: From develop
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != develop ] || [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::Pull requests into main come from this repo's develop branch."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      # Every release's tag (none before the first), and main's version as fetched now. A failing
      # call fails the step (and release_check fails if it can't read main's version), so the
      # gate never passes on an error.
      - name: Version above the last release and main
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName -q '.[].tagName')"
          uv run --no-project python tools/release_check.py --base "origin/$BASE_REF" --above $tags
