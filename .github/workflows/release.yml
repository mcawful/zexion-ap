name: Release

# A merge into main (only develop's pull requests, which release-gate.yml checked) publishes
# the release: the helper and proxy built here, the Linux helper built in the Steam Runtime's
# SDK (the linux-helper job), the apworld, the player guides and the sample YAMLs, under the
# tag v<VERSION>. A version already released from this same commit is skipped (a re-run); one
# released from another commit, or left as a draft, fails the job instead. The release job runs
# in the "release" environment, which waits for the owner's approval in GitHub before anything is
# tagged or published, each attempt again (a re-run too); the linux-helper job before it only
# builds, with a read-only token, and publishes nothing.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The Linux helper, built as ci.yml's native-linux-runtime job builds it, in the same pinned
  # Steam Runtime SDK, with a read-only token (the image is a third party's); handed to the
  # release job as an artifact, which tools/build_apworld.py checks before it packs it.
  linux-helper:
    name: Linux helper (Steam Runtime)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:3.0.20261021.266025@sha256:bb30053d3cd19d35c76ae69b2790dbaa1430448006f8240cb6d7e723f2d1940e
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake -S native -B native/build -G Ninja -DCMAKE_CXX_COMPILER=g++-14
          cmake --build native/build
      - name: Native tests
        run: ctest --test-dir native/build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: libzexion_ap
          path: native/build/libzexion_ap.so
          if-no-files-found: error

  release:
    name: build and publish
    runs-on: windows-latest
    needs: linux-helper
    environment: release
    steps:
      - uses: actions/checkout@v7
      # Into native/build, where tools/build_apworld.py takes it (LINUX_HELPER), and checks it
      # loads in the Steam Runtime (its glibc and its C++ runtime) and is of this version.
      - uses: actions/download-artifact@v4
        with:
          name: libzexion_ap
          path: native/build
      - name: Build the helper and proxy
        run: |
          cmake -S native -B native/build -A x64
          cmake --build native/build --config Release
      - name: Native tests
        run: ctest --test-dir native/build -C Release --output-on-failure
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # release_check fails here too if the version's notes are missing or unfinished. A
        # release of this version that is a draft (a publish that failed part-way) or tags
        # another commit (main changed under a released number) fails here: skipping it would
        # leave this commit in no release with the run green.
        run: |
          version="$(python tools/release_check.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if draft="$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2> /dev/null)"; then
            if [ "$draft" != false ]; then
              echo "::error::v$version is a draft release: publish or delete it on GitHub, then re-run this workflow."
              exit 1
            fi
            tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/v$version" -q .sha)"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::v$version is already released from $tagged, not this commit ($GITHUB_SHA): raise the version and merge develop into main again."
              exit 1
            fi
            echo "v$version is already released from this commit: nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the release
        if: steps.version.outputs.skip != 'true'
        run: python tools/build_apworld.py --out dist
      - name: Publish
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        # The message (tools/release_notes.py): the version's notes for players,
        # docs/releases/<VERSION>.md, then the install guide, .github/release-footer.md, then the
        # compare link from the latest release, which is the one before this (the Version step
        # stopped if this one exists). Missing or unfinished notes, or any other failure, stop the
        # job before anything is published.
        run: |
          set -euo pipefail
          previous="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name)"
          notes="$RUNNER_TEMP/release-notes.md"
          python tools/release_notes.py "$VERSION" --previous "$previous" --out "$notes"
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Zexion-AP $VERSION" --notes-file "$notes"
