name: Release

# A merge into main (only develop's pull requests, which release-gate.yml checked) publishes
# the release: the helper and proxy built here, the apworld, the player guides and the sample
# YAMLs, under the tag v<VERSION>. A version already released from this same commit is skipped (a re-run); one
# released from another commit, or left as a draft, fails the job instead. The job runs in the
# "release" environment, which waits for the owner's approval in GitHub before anything is built
# or published.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: build and publish
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - name: Build the helper and proxy
        run: |
          cmake -S native -B native/build -A x64
          cmake --build native/build --config Release
      - name: Native tests
        run: ctest --test-dir native/build -C Release --output-on-failure
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # A release of this version that is a draft (a publish that failed part-way) or tags
        # another commit (main changed under a released number) fails here: skipping it would
        # leave this commit in no release with the run green.
        run: |
          version="$(python tools/release_check.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if draft="$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2> /dev/null)"; then
            if [ "$draft" != false ]; then
              echo "::error::v$version is a draft release: publish or delete it on GitHub, then re-run this workflow."
              exit 1
            fi
            tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/v$version" -q .sha)"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::v$version is already released from $tagged, not this commit ($GITHUB_SHA): raise the version and merge develop into main again."
              exit 1
            fi
            echo "v$version is already released from this commit: nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the release
        if: steps.version.outputs.skip != 'true'
        run: python tools/build_apworld.py --out dist
      - name: Publish
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        # The notes: GitHub's generated ones (the pull requests since the latest release, named
        # here: left to itself, GitHub may compare against no tag and list every pull request),
        # then the install guide, .github/release-footer.md, with {{VERSION}} filled in. Any
        # failure, or empty generated notes, stops the job before anything is published.
        run: |
          set -euo pipefail
          previous="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name)"
          notes="$RUNNER_TEMP/release-notes.md"
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="v$VERSION" \
            -f target_commitish="$GITHUB_SHA" -f previous_tag_name="$previous" -q .body > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::error::GitHub generated no release notes for v$VERSION since $previous."
            exit 1
          fi
          printf '\n\n' >> "$notes"
          sed "s/{{VERSION}}/$VERSION/g" .github/release-footer.md >> "$notes"
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Zexion-AP $VERSION" --notes-file "$notes"
